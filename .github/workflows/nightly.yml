name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS nightly
    runs-on: macos-latest
    env:
      TARGET_TRIPLE: aarch64-apple-darwin

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Build arm64 release binary
        run: cargo build --release --target "${TARGET_TRIPLE}"

      - name: Package nightly artifact
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=12 HEAD)"
          archive="cortex-nightly-${RUN_NUMBER}-${short_sha}-${TARGET_TRIPLE}.tar.gz"
          .github/scripts/package-macos-arm64.sh \
            "target/${TARGET_TRIPLE}/release/cortex" \
            "${archive}"

          {
            echo "archive=${archive}"
            echo "checksum=${archive}.sha256"
            echo "artifact_name=cortex-nightly-${RUN_NUMBER}-${TARGET_TRIPLE}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_ENV}"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ env.archive }}
            ${{ env.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Write nightly summary
        run: |
          {
            echo "## Cortex nightly"
            echo
            echo "Nightly builds are unstable test artifacts from main."
            echo
            echo "- Commit: ${short_sha}"
            echo "- Archive: ${archive}"
            echo "- Checksum: ${checksum}"
          } >> "${GITHUB_STEP_SUMMARY}"
