name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    runs-on: macos-latest
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      checksum: ${{ steps.package.outputs.checksum }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on main
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        id: package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            arm64) target_triple="aarch64-apple-darwin" ;;
            x86_64) target_triple="x86_64-apple-darwin" ;;
            *)
              echo "Unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          archive="cortex-${TAG_NAME}-${target_triple}.tar.gz"
          mkdir -p dist
          cp target/release/cortex dist/cortex
          tar -czf "${archive}" -C dist cortex
          shasum -a 256 "${archive}" > "${archive}.sha256"

          {
            echo "archive=${archive}"
            echo "checksum=${archive}.sha256"
          } >> "${GITHUB_ENV}"

          {
            echo "archive=${archive}"
            echo "checksum=${archive}.sha256"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: |
            ${{ env.archive }}
            ${{ env.checksum }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: release-package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ARCHIVE: release-package/${{ needs.checks.outputs.archive }}
          CHECKSUM: release-package/${{ needs.checks.outputs.checksum }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists; refusing to overwrite assets." >&2
            exit 1
          fi

          read -r object_type object_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" \
              --jq '.object | [.type, .sha] | @tsv'
          )

          while [[ "${object_type}" == "tag" ]]; do
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                --jq '.object | [.type, .sha] | @tsv'
            )
          done

          if [[ "${object_type}" != "commit" || "${object_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${TAG_NAME} no longer targets checked commit ${GITHUB_SHA}." >&2
            exit 1
          fi

          gh release create "${TAG_NAME}" "${ARCHIVE}" "${CHECKSUM}" \
            --verify-tag \
            --title "${TAG_NAME}" \
            --notes "Cortex ${TAG_NAME}"
