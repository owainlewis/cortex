name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    runs-on: macos-latest
    env:
      TARGET_TRIPLE: aarch64-apple-darwin
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      checksum: ${{ steps.package.outputs.checksum }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on main
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build arm64 release binary
        run: cargo build --release --target "${TARGET_TRIPLE}"

      - name: Package binary
        id: package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          archive="cortex-${TAG_NAME}-${TARGET_TRIPLE}.tar.gz"
          .github/scripts/package-macos-arm64.sh \
            "target/${TARGET_TRIPLE}/release/cortex" \
            "${archive}"

          {
            echo "archive=${archive}"
            echo "checksum=${archive}.sha256"
          } >> "${GITHUB_ENV}"

          {
            echo "archive=${archive}"
            echo "checksum=${archive}.sha256"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-package-${{ github.sha }}
          path: |
            ${{ env.archive }}
            ${{ env.checksum }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package-${{ github.sha }}
          path: release-package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ARCHIVE: release-package/${{ needs.checks.outputs.archive }}
          CHECKSUM: release-package/${{ needs.checks.outputs.checksum }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists; refusing to overwrite assets." >&2
            exit 1
          fi

          read -r object_type object_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" \
              --jq '.object | [.type, .sha] | @tsv'
          )

          while [[ "${object_type}" == "tag" ]]; do
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                --jq '.object | [.type, .sha] | @tsv'
            )
          done

          if [[ "${object_type}" != "commit" || "${object_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${TAG_NAME} no longer targets checked commit ${GITHUB_SHA}." >&2
            exit 1
          fi

          gh release create "${TAG_NAME}" "${ARCHIVE}" "${CHECKSUM}" \
            --verify-tag \
            --title "${TAG_NAME}" \
            --notes "Cortex ${TAG_NAME}"
